{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - HKAuth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center font-sans">

  <div class="bg-zinc-900 p-8 rounded-2xl shadow-lg w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    {% if error %}
      <p class="text-red-500 text-sm text-center mb-4">{{ error }}</p>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="username" class="block text-sm mb-1">Username</label>
        <input type="text" name="username" id="username" required
               class="w-full px-4 py-2 rounded-lg bg-zinc-800 text-white border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-white">
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input type="password" name="password" id="password" required
               class="w-full px-4 py-2 rounded-lg bg-zinc-800 text-white border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-white">
      </div>
      <button type="submit"
              class="w-full bg-white text-black font-semibold py-2 rounded-lg hover:bg-zinc-200 transition-all">
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-zinc-400 mt-4">
      Already have an account? <a href="{% url 'login_form' %}" class="underline hover:text-white">Login</a>
    </p>
  </div>

</body>
</html>
