<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-Inter flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-4xl font-bold mb-6">Welcome to the App</h1>
        
        <div class="flex justify-center space-x-6 mt-6">
            <a href="{% url 'signup_form' %}" 
               class="inline-block px-6 py-3 rounded-2xl border border-white text-white hover:bg-white hover:text-black transition duration-300 shadow-md hover:shadow-white/20">
                Sign Up
            </a>

            <a href="{% url 'login_form' %}" 
               class="inline-block px-6 py-3 rounded-2xl border border-white text-white hover:bg-white hover:text-black transition duration-300 shadow-md hover:shadow-white/20">

        </div>

</html>
